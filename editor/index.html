<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>rjzyweb 数据编辑器（本地）</title>
<link rel="stylesheet" href="../vendor/font-awesome/css/all.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:#f1f5f9;color:#0f172a;height:100vh;overflow:hidden}
.hd{background:#fff;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;gap:16px;padding:0 16px;height:54px;flex:0 0 auto}
.hd-logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
.hd-logo .dot{width:12px;height:12px;border-radius:3px;background:#2563eb;display:inline-block}
.tabs{display:flex;background:#eef2f7;border-radius:9px;padding:3px}
.tab{border:none;background:transparent;padding:6px 16px;border-radius:7px;font-size:13px;cursor:pointer;color:#475569}
.tab.on{background:#fff;color:#2563eb;font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.hd-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.save-state{font-size:12px;color:#94a3b8}
.save-state.ok{color:#16a34a}
.save-state.err{color:#dc2626}
.btn{border:none;border-radius:8px;padding:8px 16px;font-size:13px;cursor:pointer;font-family:inherit}
.btn.primary{background:#2563eb;color:#fff;font-weight:500}
.btn.primary:hover{background:#1d4ed8}
.btn.ghost{background:#fff;color:#334155;border:1px solid #cbd5e1}
.btn.ghost:hover{background:#f8fafc}
.btn.danger{background:#fee2e2;color:#b91c1c}
.main{height:calc(100vh - 54px);display:flex;flex-direction:column}
.panel{display:none;flex:1;min-height:0}
.panel.on{display:grid;grid-template-columns:150px minmax(260px,1fr) minmax(330px,44%);gap:12px;padding:12px;min-height:0}
.col{background:#fff;border:1px solid #e2e8f0;border-radius:12px;display:flex;flex-direction:column;min-height:0}
.col-title{font-size:12px;color:#94a3b8;padding:12px 12px 8px;display:flex;align-items:center;gap:8px;flex:0 0 auto}
.col-title input{flex:1;font-size:12px;border:1px solid #e2e8f0;border-radius:7px;padding:5px 8px;outline:none;min-width:0}
.cat-list,.soft-list,.tut-cat-list,.tut-list{overflow-y:auto;padding:0 8px 8px;flex:1}
.cat-item,.tut-cat-item{display:flex;align-items:center;justify-content:space-between;width:100%;border:none;background:transparent;padding:8px 10px;border-radius:8px;font-size:13px;cursor:pointer;color:#334155;margin-bottom:2px;text-align:left;font-family:inherit}
.cat-item:hover,.tut-cat-item:hover{background:#f1f5f9}
.cat-item.on,.tut-cat-item.on{background:#e6f1fb;color:#185fa5;font-weight:500}
.cat-item .n,.tut-cat-item .n{font-size:11px;color:#94a3b8}
.soft-item,.tut-item{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;cursor:pointer;margin-bottom:4px;border:1px solid transparent}
.soft-item:hover,.tut-item:hover{background:#f8fafc}
.soft-item.on,.tut-item.on{background:#e6f1fb;border-color:#bfdbfe}
.soft-ic{width:36px;height:36px;flex:0 0 36px;border-radius:8px;background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600}
.soft-ic.custom{background:#fff;border:1px solid #e2e8f0;overflow:hidden;padding:2px}
.soft-ic.custom img{width:100%;height:100%;object-fit:contain}
.soft-txt{min-width:0;flex:1}
.soft-txt .nm{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.soft-txt .sb{font-size:11px;color:#94a3b8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dash-btn{width:calc(100% - 16px);margin:0 8px 10px;border:1px dashed #93c5fd;background:#fff;color:#2563eb;padding:9px;border-radius:9px;font-size:13px;cursor:pointer;font-family:inherit;flex:0 0 auto}
.dash-btn:hover{background:#eff6ff}
.edit-pane{overflow-y:auto;padding:14px}
.edit-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.edit-head .tt{font-size:15px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fld{margin-bottom:10px}
.fld label{display:block;font-size:11px;color:#64748b;margin-bottom:4px}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid #cbd5e1;border-radius:8px;padding:7px 9px;font-size:13px;font-family:inherit;outline:none;background:#fff;color:#0f172a}
.fld textarea{resize:vertical;min-height:54px;line-height:1.5}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:#2563eb}
.ver-card{border:1px solid #e2e8f0;border-radius:10px;margin-bottom:8px;background:#fbfcfe}
.ver-head{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px dashed #e8edf3}
.ver-name{flex:1;border:1px solid transparent;background:transparent;border-radius:6px;padding:5px 8px;font-size:13px;font-weight:600;outline:none;min-width:0}
.ver-name:hover,.ver-name:focus{border-color:#cbd5e1;background:#fff}
.mini{border:none;background:#eef2f7;color:#475569;border-radius:6px;padding:3px 8px;font-size:12px;cursor:pointer;font-family:inherit}
.mini:hover{background:#e2e8f0}
.mini.del{background:#fee2e2;color:#b91c1c}
.mini.del:hover{background:#fecaca}
.mini.add{background:#dbeafe;color:#1d4ed8}
.lk-row{display:grid;grid-template-columns:1fr 96px auto;gap:6px;padding:5px 10px;align-items:center}
.lk-row input{border:1px solid #e2e8f0;border-radius:6px;padding:5px 8px;font-size:12px;outline:none;font-family:inherit}
.lk-row input:focus{border-color:#2563eb}
.pill{font-size:11px;padding:4px 8px;border-radius:99px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px;text-align:center}
.pill.green{background:#dcfce7;color:#15803d}
.pill.gray{background:#f1f5f9;color:#64748b}
.lk-add{margin:2px 10px 8px}
.sub-title{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:#334155;margin:14px 0 8px}
.sub-title .mini{margin-left:auto}
.ico-hint{font-size:10px;color:#94a3b8;margin-top:3px}
.stp-card{border:1px solid #e2e8f0;border-left:3px solid #94a3b8;border-radius:8px;margin-bottom:8px;background:#fff;padding:8px}
.stp-card.t-h2{border-left-color:#2563eb}
.stp-card.t-p{border-left-color:#16a34a}
.stp-card.t-quote{border-left-color:#d97706}
.stp-card.t-note{border-left-color:#7c3aed}
.stp-card.t-ol{border-left-color:#0891b2}
.stp-card.t-img{border-left-color:#db2777}
.stp-bar{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.stp-tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:5px;background:#f1f5f9;color:#475569;flex:0 0 auto}
.stp-tools{margin-left:auto;display:flex;gap:4px}
.stp-body input,.stp-body textarea{width:100%;border:1px solid #e2e8f0;border-radius:6px;padding:6px 8px;font-size:12px;font-family:inherit;outline:none;margin-bottom:4px}
.stp-body textarea{min-height:40px;resize:vertical;line-height:1.5}
.stp-body input:focus,.stp-body textarea:focus{border-color:#2563eb}
.stp-adds{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.stp-adds .mini{padding:5px 10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:99;max-width:80vw}
.toast.show{opacity:1}
.toast.err{background:#b91c1c}
.modal-ov{position:fixed;inset:0;background:rgba(15,23,42,.4);display:none;align-items:center;justify-content:center;z-index:50}
.modal-ov.show{display:flex}
.modal{background:#fff;border-radius:14px;width:min(640px,92vw);max-height:80vh;display:flex;flex-direction:column}
.modal-head{padding:14px 18px;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;font-weight:700;font-size:14px}
.modal-head .mini{margin-left:auto}
.modal-body{padding:12px 18px;overflow-y:auto;min-height:0}
.bk-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;border:1px solid #f1f5f9;margin-bottom:6px;font-size:12px}
.bk-row .bk-nm{flex:1;min-width:0;word-break:break-all}
.bk-row .bk-k{font-size:10px;padding:2px 6px;border-radius:4px;background:#e6f1fb;color:#185fa5}
.bk-empty{color:#94a3b8;font-size:12px;padding:18px;text-align:center}
.emptytip{color:#b0b8c4;font-size:12px;text-align:center;padding:24px 8px}
.mt{margin-left:auto}
</style>
</head>
<body>
<header class="hd">
  <div class="hd-logo"><span class="dot"></span>数据编辑器 · rjzyweb</div>
  <div class="tabs">
    <button id="tabSoft" class="tab on">软件库</button>
    <button id="tabTut" class="tab">教程库</button>
  </div>
  <div class="hd-right">
    <span id="saveState" class="save-state">已同步</span>
    <button id="btnBackup" class="btn ghost">备份 / 恢复</button>
    <button id="btnSave" class="btn primary">保存到文件</button>
  </div>
</header>

<div class="main">
  <section class="panel on" id="panelSoft">
    <aside class="col">
      <div class="col-title">分类</div>
      <div class="cat-list" id="catList"></div>
    </aside>
    <section class="col">
      <div class="col-title">软件列表
        <input id="softSearch" type="text" placeholder="搜索名称…">
      </div>
      <div class="soft-list" id="softList"></div>
      <button class="dash-btn" id="btnAddSoft">＋ 新增软件</button>
    </section>
    <aside class="col edit-pane" id="softEdit"></aside>
  </section>

  <section class="panel" id="panelTut">
    <aside class="col">
      <div class="col-title">分类</div>
      <div class="tut-cat-list" id="tutCatList"></div>
    </aside>
    <section class="col">
      <div class="col-title">教程列表
        <input id="tutSearch" type="text" placeholder="搜索标题…">
      </div>
      <div class="tut-list" id="tutList"></div>
      <button class="dash-btn" id="btnAddTut">＋ 新增教程</button>
    </section>
    <aside class="col edit-pane" id="tutEdit"></aside>
  </section>
</div>

<div class="toast" id="toast"></div>

<div class="modal-ov" id="bkModal">
  <div class="modal">
    <div class="modal-head">备份与恢复<span class="mini" id="bkClose">关闭</span></div>
    <div class="modal-body" id="bkList"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
